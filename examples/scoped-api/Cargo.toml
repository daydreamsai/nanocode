[package]
name = "nanocode-scoped-api"
autotests = false
autobenches = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository.workspace = true
description = "An HTTP API of per-scope folds over the partitioned turn log, served by identical stateless replicas that route each scope to its partition's lease holder"

[[bin]]
name = "scoped-api"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
nanocode-durability-core.workspace = true
nanocode-executor.workspace = true
nanocode-io.workspace = true
nanocode-partitions.workspace = true
nanocode-scope.workspace = true
nanocode-store-sql = { path = "../../crates/integrations/store-sql" }
nanocode-sync.workspace = true
nanocode-turnlog.workspace = true
serde_json.workspace = true

[lints]
workspace = true
